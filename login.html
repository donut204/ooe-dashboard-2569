<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | OOE Dashboard 2569</title>
<style>
:root{
  --navy:#102a43;
  --navy-2:#142b50;
  --blue:#245dcc;
  --muted:#627d98;
  --line:#d9e2ec;
  --bg:#f3f6fb;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  padding:20px;
  color:#243b53;
  font:15px "Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 18% 18%,rgba(36,93,204,.10),transparent 30%),
    radial-gradient(circle at 82% 80%,rgba(16,42,67,.08),transparent 32%),
    linear-gradient(145deg,#eef4fb,#f8fafc);
}
body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
  opacity:.65;
  animation:float 9s ease-in-out infinite;
}
body::before{
  width:240px;height:240px;
  left:-80px;top:-70px;
  background:linear-gradient(145deg,rgba(36,93,204,.10),rgba(255,255,255,.05));
}
body::after{
  width:190px;height:190px;
  right:-55px;bottom:-45px;
  background:linear-gradient(145deg,rgba(16,42,67,.08),rgba(36,93,204,.05));
  animation-delay:-4s;
}
.login-layout{
  width:min(760px,100%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.card{
  position:relative;
  flex:0 1 430px;
  width:min(430px,100%);
  padding:40px 34px 34px;
  overflow:hidden;
  text-align:center;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(226,232,240,.95);
  border-radius:24px;
  box-shadow:0 22px 60px rgba(16,42,67,.13);
  backdrop-filter:blur(14px);
  animation:enter .5s ease-out both;
}
.card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  opacity:.75;
}
.mark{
  position:relative;
  width:68px;height:68px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:20px;
  background:linear-gradient(145deg,var(--navy-2),#1c3d69);
  color:#fff;
  font-size:23px;
  font-weight:800;
  letter-spacing:.5px;
  box-shadow:0 10px 25px rgba(20,43,80,.18);
}
.mark::after{
  content:"";
  position:absolute;
  width:28px;height:110px;
  top:-20px;left:-45px;
  transform:rotate(24deg);
  background:rgba(255,255,255,.18);
  animation:shine 5s ease-in-out infinite;
}
h1{
  margin:0;
  color:#071d40;
  font-size:28px;
  letter-spacing:-.25px;
}
.subtitle{
  margin:8px 0 0;
  color:var(--muted);
}
.access{
  width:max-content;
  max-width:100%;
  margin:16px auto 0;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid #dce6f2;
  border-radius:999px;
  background:#f8fbff;
  color:#526b85;
  font-size:12px;
}
.access-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#1aa36f;
  box-shadow:0 0 0 4px rgba(26,163,111,.10);
}
.divider{
  height:1px;
  margin:25px 0;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}
#googleSignIn{
  display:flex;
  justify-content:center;
  min-height:44px;
  transition:transform .2s ease;
}
#googleSignIn:hover{transform:translateY(-1px)}
.hint{
  margin:19px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
}
.hint strong{color:#415b78}
.message{
  margin:16px 0 0;
  padding:10px 12px;
  border-radius:10px;
  font-size:13px;
}
.message:empty{display:none}
.message.error{background:#fdecef;color:#a61b35}
.message.setup{background:#fff4d6;color:#895b00}
.setup-box{
  padding:12px 16px;
  border:1px dashed #bcccdc;
  border-radius:12px;
  color:#627d98;
  background:#f8fafc;
}
code{font-family:Consolas,monospace}
.footer{
  margin-top:25px;
  color:#9aa8b6;
  font-size:12px;
}
.mascot-wrap{
  flex:0 0 300px;
  min-height:380px;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.mascot{
  width:300px;
  max-width:100%;
  overflow:visible;
  filter:drop-shadow(0 18px 24px rgba(16,42,67,.14));
  animation:robotFloat 4.6s ease-in-out infinite;
}
.robot-eye{
  transform-box:fill-box;
  transform-origin:center;
  animation:softBlink 5.4s ease-in-out infinite;
}
.idea-ray{
  animation:ideaPulse 1.8s ease-in-out infinite;
}
.idea-ray:nth-child(2){animation-delay:.18s}
.idea-ray:nth-child(3){animation-delay:.36s}
@keyframes robotFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}
@keyframes ideaPulse{
  0%,100%{opacity:.35}
  50%{opacity:1}
}
@keyframes softBlink{
  0%,45%,49%,100%{transform:scaleY(1)}
  47%{transform:scaleY(.12)}
}
@keyframes enter{
  from{opacity:0;transform:translateY(10px) scale(.99)}
  to{opacity:1;transform:none}
}
@keyframes float{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,10px,0)}
}
@keyframes shine{
  0%,72%{left:-45px}
  88%,100%{left:95px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media(max-width:760px){
  body{overflow:auto;padding:26px 16px}
  .login-layout{flex-direction:column-reverse;gap:0}
  .mascot-wrap{flex-basis:auto;min-height:160px;margin-bottom:-10px}
  .mascot{width:165px}
  .card{width:min(430px,100%)}
}
@media(max-width:480px){
  .card{padding:34px 22px 28px;border-radius:20px}
  h1{font-size:25px}
  .mascot{width:145px}
  .mascot-wrap{min-height:145px}
}
</style>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="login-layout">
  <main class="card">
    <div class="mark">OOE</div>
    <h1>OOE Dashboard 2569</h1>
    <p class="subtitle">สำนักงานการจัดการศึกษาออนไลน์</p>

    <div class="access">
      <span class="access-dot"></span>
      <span>Google Workspace access</span>
    </div>

    <div class="divider"></div>

    <div id="googleSignIn"></div>
    <div id="loginMessage" class="message"></div>

    <p class="hint">
      เข้าสู่ระบบด้วยบัญชี Google Workspace ของมหาวิทยาลัย<br>
      <strong>@spu.ac.th</strong>
    </p>

    <div class="footer">Office of Online Education · Sripatum University</div>
  </main>

  <div class="mascot-wrap" aria-hidden="true">
    <svg class="mascot" viewBox="0 0 360 420" role="img" aria-label="หุ่นยนต์ผู้ช่วยการเรียนรู้">
      <defs>
        <linearGradient id="robotShell" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".62" stop-color="#edf3fb"/>
          <stop offset="1" stop-color="#d3deeb"/>
        </linearGradient>
        <linearGradient id="robotScreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#173955"/>
          <stop offset="1" stop-color="#071d31"/>
        </linearGradient>
        <linearGradient id="robotBlue" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#337cf0"/>
          <stop offset="1" stop-color="#174fae"/>
        </linearGradient>
      </defs>

      <ellipse cx="181" cy="389" rx="82" ry="12" fill="#102a43" opacity=".09"/>

      <!-- antenna -->
      <rect x="151" y="18" width="58" height="24" rx="12" fill="#d9e3ef"/>
      <rect x="166" y="27" width="28" height="7" rx="4" fill="#31d7ef"/>

      <!-- head / ears -->
      <rect x="46" y="93" width="34" height="62" rx="17" fill="#dfe7f1"/>
      <rect x="280" y="93" width="34" height="62" rx="17" fill="#dfe7f1"/>
      <rect x="67" y="42" width="226" height="157" rx="62" fill="url(#robotShell)" stroke="#bccbdd" stroke-width="3"/>
      <rect x="85" y="61" width="190" height="118" rx="42" fill="url(#robotScreen)"/>
      <path d="M102 78 Q126 66 151 71" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".12"/>

      <!-- face -->
      <ellipse class="robot-eye" cx="132" cy="115" rx="15" ry="23" fill="#55e4ed"/>
      <path d="M198 124 Q217 103 237 121" fill="none" stroke="#55e4ed" stroke-width="11" stroke-linecap="round"/>
      <path d="M166 145 Q180 158 194 145" fill="#55e4ed"/>

      <!-- neck -->
      <rect x="153" y="192" width="54" height="38" rx="16" fill="#cad5e3"/>

      <!-- body -->
      <path d="M111 229
               Q137 210 180 210
               Q223 210 249 229
               L240 315
               Q220 350 180 350
               Q140 350 120 315
               Z"
            fill="url(#robotShell)" stroke="#bccbdd" stroke-width="3"/>
      <path d="M133 239 Q153 225 180 225" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".45"/>
      <rect x="161" y="248" width="38" height="14" rx="7" fill="#31d7ef"/>

      <!-- left shoulder / arm -->
      <circle cx="115" cy="245" r="21" fill="#dbe5f1" stroke="#bccbdd" stroke-width="3"/>
      <path d="M103 258 Q82 277 82 307" fill="none" stroke="#dfe8f3" stroke-width="30" stroke-linecap="round"/>
      <circle cx="83" cy="312" r="20" fill="#f5f8fc" stroke="#bccbdd" stroke-width="3"/>

      <!-- book, clean front perspective -->
      <g>
        <path d="M61 288 L118 269 L132 347 L75 364 Z" fill="url(#robotBlue)" stroke="#12458f" stroke-width="3"/>
        <path d="M118 269 L151 280 L148 355 L132 347 Z" fill="#215fc2" stroke="#12458f" stroke-width="3"/>
        <path d="M67 286 L115 271" stroke="#eaf3ff" stroke-width="6" stroke-linecap="round"/>
        <path d="M93 317 l15 8 15-8 -15-8z" fill="#9fd6ff"/>
        <path d="M108 325 v12" stroke="#9fd6ff" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- right shoulder / arm -->
      <circle cx="245" cy="245" r="21" fill="#dbe5f1" stroke="#bccbdd" stroke-width="3"/>
      <path d="M258 255 Q281 268 286 293" fill="none" stroke="#dfe8f3" stroke-width="30" stroke-linecap="round"/>

      <!-- hand -->
      <circle cx="288" cy="300" r="22" fill="#f5f8fc" stroke="#bccbdd" stroke-width="3"/>
      <ellipse cx="275" cy="301" rx="7" ry="11" fill="#d3deeb" transform="rotate(-28 275 301)"/>

      <!-- raised index finger -->
      <path d="M292 288 L299 239" stroke="#f5f8fc" stroke-width="20" stroke-linecap="round"/>
      <path d="M292 288 L299 239" stroke="#b8c6d7" stroke-width="3" stroke-linecap="round" opacity=".75"/>

      <!-- idea rays -->
      <g fill="#f4c84d">
        <rect class="idea-ray" x="312" y="229" width="8" height="24" rx="4" transform="rotate(10 316 241)"/>
        <rect class="idea-ray" x="322" y="249" width="8" height="22" rx="4" transform="rotate(48 326 260)"/>
        <rect class="idea-ray" x="309" y="266" width="8" height="20" rx="4" transform="rotate(78 313 276)"/>
      </g>
    </svg>
  </div>
</div>

<script>
window.addEventListener("load", () => OOEAuth.setupLogin());
</script>
</body>
</html>
