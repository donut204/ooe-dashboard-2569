<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | OOE Dashboard 2569</title>
<style>
:root{--navy:#102a43;--blue:#245dcc;--muted:#627d98;--bg:#f3f6fb;--line:#d9e2ec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eef4fb,#f8fafc);font:15px "Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;color:#243b53;padding:20px}
.card{width:min(430px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 18px 50px rgba(16,42,67,.14);padding:38px 34px;text-align:center}
.mark{width:66px;height:66px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#142b50;color:#fff;font-size:24px;font-weight:800}
h1{margin:0;color:#071d40;font-size:28px}
.subtitle{margin:8px 0 4px;color:var(--muted)}
.term{margin:0 0 26px;color:#8a9aab;font-size:13px}
.divider{height:1px;background:var(--line);margin:25px 0}
#googleSignIn{display:flex;justify-content:center;min-height:44px}
.hint{margin:19px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.message{margin:16px 0 0;padding:10px 12px;border-radius:10px;font-size:13px}
.message:empty{display:none}
.message.error{background:#fdecef;color:#a61b35}
.message.setup{background:#fff4d6;color:#895b00}
.setup-box{padding:12px 16px;border:1px dashed #bcccdc;border-radius:12px;color:#627d98;background:#f8fafc}
code{font-family:Consolas,monospace}
.footer{margin-top:24px;color:#9aa8b6;font-size:12px}
</style>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main class="card">
  <div class="mark">OOE</div>
  <h1>OOE Dashboard 2569</h1>
  <p class="subtitle">สำนักงานการจัดการศึกษาออนไลน์</p>
  <p class="term">ปีการศึกษา 2569 · ภาคการศึกษา 1</p>
  <div class="divider"></div>
  <div id="googleSignIn"></div>
  <div id="loginMessage" class="message"></div>
  <p class="hint">เข้าสู่ระบบด้วยบัญชี Google Workspace ของมหาวิทยาลัย<br><strong>@spu.ac.th</strong></p>
  <div class="footer">Office of Online Education · Sripatum University</div>
</main>
<script>
window.addEventListener("load", () => OOEAuth.setupLogin());
</script>
</body>
</html>
