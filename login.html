<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | OOE Dashboard 2569</title>
<style>
:root{
  --navy:#102a43;
  --navy-2:#142b50;
  --blue:#245dcc;
  --muted:#627d98;
  --line:#d9e2ec;
  --bg:#f3f6fb;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  padding:20px;
  color:#243b53;
  font:15px "Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 18% 18%,rgba(36,93,204,.10),transparent 30%),
    radial-gradient(circle at 82% 80%,rgba(16,42,67,.08),transparent 32%),
    linear-gradient(145deg,#eef4fb,#f8fafc);
}
body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
  opacity:.65;
  animation:float 9s ease-in-out infinite;
}
body::before{
  width:240px;height:240px;
  left:-80px;top:-70px;
  background:linear-gradient(145deg,rgba(36,93,204,.10),rgba(255,255,255,.05));
}
body::after{
  width:190px;height:190px;
  right:-55px;bottom:-45px;
  background:linear-gradient(145deg,rgba(16,42,67,.08),rgba(36,93,204,.05));
  animation-delay:-4s;
}
.login-layout{
  width:min(760px,100%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.card{
  position:relative;
  flex:0 1 430px;
  width:min(430px,100%);
  padding:40px 34px 34px;
  overflow:hidden;
  text-align:center;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(226,232,240,.95);
  border-radius:24px;
  box-shadow:0 22px 60px rgba(16,42,67,.13);
  backdrop-filter:blur(14px);
  animation:enter .5s ease-out both;
}
.card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  opacity:.75;
}
.mark{
  position:relative;
  width:68px;height:68px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:20px;
  background:linear-gradient(145deg,var(--navy-2),#1c3d69);
  color:#fff;
  font-size:23px;
  font-weight:800;
  letter-spacing:.5px;
  box-shadow:0 10px 25px rgba(20,43,80,.18);
}
.mark::after{
  content:"";
  position:absolute;
  width:28px;height:110px;
  top:-20px;left:-45px;
  transform:rotate(24deg);
  background:rgba(255,255,255,.18);
  animation:shine 5s ease-in-out infinite;
}
h1{
  margin:0;
  color:#071d40;
  font-size:28px;
  letter-spacing:-.25px;
}
.subtitle{
  margin:8px 0 0;
  color:var(--muted);
}
.access{
  width:max-content;
  max-width:100%;
  margin:16px auto 0;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid #dce6f2;
  border-radius:999px;
  background:#f8fbff;
  color:#526b85;
  font-size:12px;
}
.access-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#1aa36f;
  box-shadow:0 0 0 4px rgba(26,163,111,.10);
}
.divider{
  height:1px;
  margin:25px 0;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}
#googleSignIn{
  display:flex;
  justify-content:center;
  min-height:44px;
  transition:transform .2s ease;
}
#googleSignIn:hover{transform:translateY(-1px)}
.hint{
  margin:19px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
}
.hint strong{color:#415b78}
.message{
  margin:16px 0 0;
  padding:10px 12px;
  border-radius:10px;
  font-size:13px;
}
.message:empty{display:none}
.message.error{background:#fdecef;color:#a61b35}
.message.setup{background:#fff4d6;color:#895b00}
.setup-box{
  padding:12px 16px;
  border:1px dashed #bcccdc;
  border-radius:12px;
  color:#627d98;
  background:#f8fafc;
}
code{font-family:Consolas,monospace}
.footer{
  margin-top:25px;
  color:#9aa8b6;
  font-size:12px;
}
.mascot-wrap{
  flex:0 0 275px;
  min-height:360px;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.mascot{
  width:270px;
  max-width:100%;
  filter:drop-shadow(0 18px 20px rgba(16,42,67,.14));
  animation:robotFloat 4.4s ease-in-out infinite;
  transform-origin:50% 72%;
}
.robot-book{transform-origin:65% 67%;animation:bookNod 4.4s ease-in-out infinite}
.robot-pointer{transform-origin:79% 53%;animation:pointerWiggle 3.8s ease-in-out infinite}
.idea-ray{animation:ideaPulse 1.9s ease-in-out infinite}
.idea-ray:nth-child(2){animation-delay:.2s}
.robot-eye-left{transform-box:fill-box;transform-origin:center;animation:softBlink 5.2s ease-in-out infinite}
@keyframes robotFloat{
  0%,100%{transform:translateY(0) rotate(-.4deg)}
  50%{transform:translateY(-10px) rotate(.7deg)}
}
@keyframes bookNod{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(-2deg)}
}
@keyframes pointerWiggle{
  0%,72%,100%{transform:rotate(0deg)}
  82%{transform:rotate(4deg)}
  90%{transform:rotate(-2deg)}
}
@keyframes ideaPulse{
  0%,100%{opacity:.5;transform:scale(.92)}
  50%{opacity:1;transform:scale(1.08)}
}
@keyframes softBlink{
  0%,44%,48%,100%{transform:scaleY(1)}
  46%{transform:scaleY(.15)}
}
@keyframes enter{
  from{opacity:0;transform:translateY(10px) scale(.99)}
  to{opacity:1;transform:none}
}
@keyframes float{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,10px,0)}
}
@keyframes shine{
  0%,72%{left:-45px}
  88%,100%{left:95px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media(max-width:760px){
  body{overflow:auto;padding:26px 16px}
  .login-layout{flex-direction:column-reverse;gap:0}
  .mascot-wrap{flex-basis:auto;min-height:160px;margin-bottom:-10px}
  .mascot{width:165px}
  .card{width:min(430px,100%)}
}
@media(max-width:480px){
  .card{padding:34px 22px 28px;border-radius:20px}
  h1{font-size:25px}
  .mascot{width:145px}
  .mascot-wrap{min-height:145px}
}
</style>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="login-layout">
  <main class="card">
    <div class="mark">OOE</div>
    <h1>OOE Dashboard 2569</h1>
    <p class="subtitle">สำนักงานการจัดการศึกษาออนไลน์</p>

    <div class="access">
      <span class="access-dot"></span>
      <span>Google Workspace access</span>
    </div>

    <div class="divider"></div>

    <div id="googleSignIn"></div>
    <div id="loginMessage" class="message"></div>

    <p class="hint">
      เข้าสู่ระบบด้วยบัญชี Google Workspace ของมหาวิทยาลัย<br>
      <strong>@spu.ac.th</strong>
    </p>

    <div class="footer">Office of Online Education · Sripatum University</div>
  </main>

  <div class="mascot-wrap" aria-hidden="true">
    <svg class="mascot" viewBox="0 0 300 390" role="img" aria-label="หุ่นยนต์ผู้ช่วยการเรียนรู้">
      <defs>
        <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".62" stop-color="#edf3fb"/>
          <stop offset="1" stop-color="#cfd9e8"/>
        </linearGradient>
        <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#173451"/>
          <stop offset="1" stop-color="#071d31"/>
        </linearGradient>
        <linearGradient id="book" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#3279ee"/>
          <stop offset="1" stop-color="#164ea9"/>
        </linearGradient>
      </defs>

      <g class="robot-float">
        <ellipse cx="149" cy="366" rx="73" ry="10" fill="#102a43" opacity=".10"/>

        <!-- head -->
        <rect x="55" y="38" width="190" height="142" rx="55" fill="url(#shell)" stroke="#b9c8da" stroke-width="3"/>
        <rect x="73" y="56" width="154" height="104" rx="36" fill="url(#screen)"/>
        <path d="M91 71 Q112 61 132 65" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".12"/>
        <rect x="38" y="84" width="27" height="54" rx="14" fill="#dde6f1"/>
        <rect x="235" y="84" width="27" height="54" rx="14" fill="#dde6f1"/>
        <rect x="122" y="24" width="56" height="22" rx="11" fill="#dbe4ef"/>
        <rect x="137" y="31" width="27" height="6" rx="3" fill="#31d7ef"/>

        <!-- face -->
        <ellipse class="robot-eye-left" cx="116" cy="100" rx="14" ry="20" fill="#58e7ef"/>
        <path d="M172 108 Q189 91 204 105" fill="none" stroke="#58e7ef" stroke-width="10" stroke-linecap="round"/>
        <path d="M143 125 Q151 135 160 125" fill="#58e7ef"/>

        <!-- neck/body -->
        <rect x="130" y="171" width="40" height="33" rx="14" fill="#c9d4e2"/>
        <path d="M85 216 Q103 192 150 192 Q197 192 215 216 L207 294 Q180 324 150 324 Q120 324 93 294 Z" fill="url(#shell)" stroke="#b9c8da" stroke-width="3"/>
        <path d="M106 221 Q125 207 146 208" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".42"/>
        <rect x="138" y="232" width="28" height="12" rx="6" fill="#31d7ef"/>

        <!-- left arm holding book -->
        <path d="M94 228 Q64 244 63 282" fill="none" stroke="#dbe5f1" stroke-width="28" stroke-linecap="round"/>
        <circle cx="64" cy="286" r="18" fill="#f4f7fb" stroke="#b9c8da" stroke-width="3"/>

        <!-- book -->
        <g class="robot-book">
          <path d="M58 274 L111 253 L129 328 L76 341 Z" fill="url(#book)" stroke="#0d3e8c" stroke-width="3"/>
          <path d="M111 253 L153 266 L148 340 L129 328 Z" fill="#1f61c7" stroke="#0d3e8c" stroke-width="3"/>
          <path d="M63 270 L107 255" stroke="#eaf3ff" stroke-width="6" stroke-linecap="round"/>
        </g>

        <!-- pointing arm -->
        <g class="robot-pointer">
          <path d="M211 225 Q243 231 251 263" fill="none" stroke="#dbe5f1" stroke-width="28" stroke-linecap="round"/>
          <circle cx="252" cy="268" r="18" fill="#f4f7fb" stroke="#b9c8da" stroke-width="3"/>
          <path d="M254 266 L260 218" stroke="#f4f7fb" stroke-width="17" stroke-linecap="round"/>
          <path d="M254 266 L260 218" stroke="#aebdce" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        </g>

        <!-- idea rays -->
        <g fill="#f5c84c">
          <rect class="idea-ray" x="270" y="203" width="8" height="25" rx="4" transform="rotate(14 274 215)"/>
          <rect class="idea-ray" x="281" y="224" width="8" height="22" rx="4" transform="rotate(54 285 235)"/>
        </g>
      </g>
    </svg>
  </div>
</div>

<script>
window.addEventListener("load", () => OOEAuth.setupLogin());
</script>
</body>
</html>
